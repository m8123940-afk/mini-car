// Turbo Rivals 3D — одно общее подключение к онлайн-сети.
// Чтобы смена Render URL не требовала правок в игре, сервер задан здесь один раз.
const SERVER_URL = 'wss://mini-car.onrender.com';
const SERVER_HTTP = 'https://mini-car.onrender.com';

const Net = (() => {
  let ws = null, open = false, currentUrl = ''; const h = {};
  function connect(url = SERVER_URL, timeoutMs = 12000) {
    return new Promise((resolve, reject) => {
      let settled = false;
      try { currentUrl = String(url || SERVER_URL).trim(); ws = new WebSocket(currentUrl); }
      catch (e) { reject(e); return; }
      const socket = ws;
      const settle = (fn, value) => { if (settled) return; settled = true; clearTimeout(timer); fn(value); };
      const timer = setTimeout(() => { try { socket.close(); } catch (_) {} settle(reject, new Error('timeout')); }, timeoutMs);
      socket.onopen = () => { if (socket !== ws) { socket.close(); return; } open = true; settle(resolve); };
      socket.onerror = () => { open = false; settle(reject, new Error('WebSocket connection failed')); };
      socket.onclose = event => { if (socket === ws) open = false; if (!settled) settle(reject, new Error('WebSocket closed (' + event.code + ')')); if (h.close) h.close(event); };
      socket.onmessage = event => {
        let message; try { message = JSON.parse(event.data); } catch (_) { return; }
        if (message && typeof message.t === 'string' && h[message.t]) h[message.t](message);
      };
    });
  }
  function wake(url = SERVER_URL) {
    const raw = String(url || SERVER_URL).trim();
    const base = raw.replace(/^wss:\/\//i, 'https://').replace(/^ws:\/\//i, 'http://').replace(/\/+$/, '');
    try { if (/^https?:\/\//i.test(base)) fetch(base + '/health', { mode: 'cors', cache: 'no-store' }).catch(() => {}); } catch (_) {}
  }
  return {
    SERVER_URL, SERVER_HTTP, connect, wake,
    send: object => { if (open && ws && ws.readyState === WebSocket.OPEN) { try { ws.send(JSON.stringify(object)); return true; } catch (_) {} } return false; },
    on: (type, fn) => { h[type] = fn; },
    close: () => { const socket = ws; ws = null; open = false; try { if (socket) socket.close(); } catch (_) {} },
    isOpen: () => open,
    currentUrl: () => currentUrl
  };
})();
